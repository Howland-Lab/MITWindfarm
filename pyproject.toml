[tool.poetry]
name = "mitwindfarm"
version = "1.1.2"
description = ""
authors = ["Jaime Liew <jaimeliew1@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">3.10,<3.15"
numpy = "^2.1.1"
scipy = ">=1.6"
mitrotor = { git = "https://github.com/Howland-Lab/MITRotor.git"}
unified-momentum-model = { git = "https://github.com/Howland-Lab/Unified-Momentum-Model.git"}
[tool.poetry.group.floris]
optional = true

[tool.poetry.group.floris.dependencies]
floris = { git = "https://github.com/NatLabRockies/floris.git", branch = "dev/v5-beta"}

[tool.poetry.group.dev.dependencies]
ipython = { version = "^8"}
jupyter = { version = "^1.0.0"}
mypy = { version = "^1.5.1"}
pytest = { version = "^7.4.2"}
ruff = { version = "^0.1.7"}
ipykernel = { version = "^6.25.1"}
matplotlib = { version = "^3.9.2"}

[tool.poetry.extras]
dev = ["ipython", "jupyter", "mypy", "pytest", "ruff", "ipykernel", "matplotlib"]
examples = ["matplotlib"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 120
